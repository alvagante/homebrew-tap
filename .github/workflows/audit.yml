name: Audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Audit casks
        run: |
          brew tap-new local/audit --no-git
          cp Casks/*.rb "$(brew --repository local/audit)/Casks/"
          for c in Casks/*.rb; do brew audit --cask --strict --online "local/audit/$(basename "$c" .rb)"; done
